# Nombre y puerto de la aplicacion
spring.application.name=${APP_NOMBRE:tienda-eventos}
server.port=8080

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:tiendadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2, util para ver los datos durante la demo:
# http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:tiendadb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate crea/actualiza las tablas automaticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator: usado por los readiness/liveness probes en Kubernetes ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
